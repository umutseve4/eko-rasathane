name: apply-m2-remote

on:
  pull_request:
    branches:
      - feat/m2-academic-timetable
    paths:
      - .github/workflows/apply-m2-remote.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2-academic-timetable
          fetch-depth: 0
      - name: Verify expected timetable base
        run: |
          test "$(git rev-parse HEAD:data/timetable.mjs)" = "fd7d4b6031f68044994ede2d24de9617b8254cf6"
      - name: Assemble timetable byte-for-byte
        run: |
          cat .m2-fixture/part-00 .m2-fixture/part-01 .m2-fixture/part-02 .m2-fixture/part-03 .m2-fixture/part-04 > data/timetable.mjs
          test "$(wc -c < data/timetable.mjs)" -eq 14637
          echo '9231d013e3cbbfb24e3ca463582c47cb42e40c2660aaad9b58a3da0afd64f87b  data/timetable.mjs' | sha256sum -c -
          ! grep -q 'PLACEHOLDER' data/timetable.mjs
          ! grep -q 'TRUNCATED_FOR_TOOL_LIMIT' data/timetable.mjs
      - name: Apply M2 patches and verify
        run: |
          python scripts/apply-m2.py
          git diff --check
          npm run verify
      - name: Commit completed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-m2-remote.yml
          git add data/timetable.mjs core.mjs app.js index.html package.json tests/core.test.mjs README.md ROADMAP.md
          git commit -m 'feat(m2): add academic timetable'
          git push origin HEAD:feat/m2-academic-timetable