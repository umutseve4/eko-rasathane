name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Static contract
        run: |
          test -f index.html
          test -f styles.css
          grep -q "BUÜ Ekonometri Program Bilgi Paketi" data.js
          grep -q "prefers-reduced-motion" styles.css
