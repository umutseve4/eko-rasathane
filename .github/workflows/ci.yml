name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run verify
      - name: Static product contract
        run: |
          test -f index.html
          test -f styles.css
          test -f data/catalog.mjs
          grep -q "Kaçıncı sınıfsın" app.js
          grep -q "BUÜ Ekonometri Program Bilgi Paketi" data/catalog.mjs
          grep -q "prefers-reduced-motion" styles.css
          grep -q "#/sinif/:id" README.md
