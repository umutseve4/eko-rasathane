name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - name: Static product contract
        run: |
          test -f index.html
          test -f styles.css
          test -f data/catalog.mjs
          grep -q "Kaçıncı sınıfsın" app.js
          grep -q "BUÜ Ekonometri Program Bilgi Paketi" data/catalog.mjs
          grep -q "prefers-reduced-motion" styles.css
          grep -q "#/sinif/:id" README.md
