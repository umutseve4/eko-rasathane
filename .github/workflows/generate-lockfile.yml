name: Generate npm lockfile

on:
  push:
    branches: [test/browser-quality-gate]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/browser-quality-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile when missing or changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock npm dependencies"
          git push origin HEAD:test/browser-quality-gate
