name: M2 integration gate
on:
  push:
    branches:
      - feat/m2-academic-timetable
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m2-remote-recovery
  cancel-in-progress: false
jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore(m2): apply runtime integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2-academic-timetable
          fetch-depth: 0
      - name: Assemble and audit authoritative fixture
        shell: bash
        run: |
          set -euo pipefail
          cat .m2-fixture/part-00 .m2-fixture/part-01 .m2-fixture/part-02 .m2-fixture/part-03 .m2-fixture/part-04 > data/timetable.mjs
          actual_size="$(wc -c < data/timetable.mjs | tr -d ' ')"
          actual_sha="$(sha256sum data/timetable.mjs | cut -d ' ' -f 1)"
          echo "size=${actual_size}"
          echo "sha256=${actual_sha}"
          test "${actual_size}" = "14637"
          test "${actual_sha}" = "9231d013e3cbbfb24e3ca463582c47cb42e40c2660aaad9b58a3da0afd64f87b"
          ! grep -E 'PLACEHOLDER|TRUNCATED_FOR_TOOL_LIMIT' data/timetable.mjs
      - name: Apply runtime patch
        run: python scripts/apply-m2.py
      - name: Verify
        run: |
          npm ci
          npm run verify
          node -e "import('./offerings.mjs').then(m=>{console.log(JSON.stringify(m.offeringSummary)); console.log(JSON.stringify(m.validateOfferings()))})"
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/timetable.mjs core.mjs app.js index.html package.json tests/core.test.mjs README.md ROADMAP.md
          if git diff --cached --quiet; then
            echo 'Verified integration already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'chore(m2): apply runtime integration'
          git push origin HEAD:feat/m2-academic-timetable
