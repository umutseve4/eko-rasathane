name: M2 integration gate
on:
  push:
    branches:
      - feat/m2-academic-timetable
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore(m2): apply runtime integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2-academic-timetable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble authoritative fixture
        run: |
          cat .m2-fixture/part-00 .m2-fixture/part-01 .m2-fixture/part-02 .m2-fixture/part-03 .m2-fixture/part-04 > data/timetable.mjs
          test "$(wc -c < data/timetable.mjs)" -eq 14637
          echo '9231d013e3cbbfb24e3ca463582c47cb42e40c2660aaad9b58a3da0afd64f87b  data/timetable.mjs' | sha256sum -c -
          ! grep -E 'PLACEHOLDER|TRUNCATED_FOR_TOOL_LIMIT' data/timetable.mjs
      - name: Apply runtime patch
        run: python scripts/apply-m2.py
      - name: Verify
        run: |
          npm ci
          npm run verify
          node -e "import('./offerings.mjs').then(m=>{console.log(JSON.stringify(m.offeringSummary)); console.log(JSON.stringify(m.validateOfferings()))})"
      - name: Commit verified integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/timetable.mjs core.mjs app.js index.html package.json tests/core.test.mjs README.md ROADMAP.md
          git commit -m 'chore(m2): apply runtime integration'
          git push
