name: browser-e2e
on:
  push:
    branches: [main, evidence/live-logo-production]
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results.json
          retention-days: 7
      - name: Publish concise failure summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Browser E2E failure\n\n';
            if (!fs.existsSync('test-results.json')) {
              body += 'Playwright did not produce a JSON report; inspect the setup steps.';
            } else {
              const report = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const failures = [];
              const visit = suite => {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    const failed = (test.results || []).find(result => result.status === 'failed' || result.status === 'timedOut');
                    if (failed) failures.push({ title: spec.title, error: failed.error?.message || 'Unknown failure' });
                  }
                }
                for (const child of suite.suites || []) visit(child);
              };
              for (const suite of report.suites || []) visit(suite);
              body += failures.length
                ? failures.slice(0, 10).map(item => `### ${item.title}\n\n\`\`\`text\n${item.error.slice(0, 1800)}\n\`\`\``).join('\n\n')
                : 'The report contains no failed test result; inspect the setup steps.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
