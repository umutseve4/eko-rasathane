name: hash-curriculum-evidence

on:
  push:
    branches:
      - chore/research-curriculum-source
    paths:
      - .github/workflows/hash-curriculum-evidence.yml

permissions:
  contents: write

jobs:
  hash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/research-curriculum-source
      - name: Record SHA-256 evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research-output/*.html | sort > research-output/hashes.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research-output/hashes.sha256
          git commit -m 'chore: record curriculum evidence hashes' || exit 0
          git push
