name: research-curriculum-source

on:
  push:
    branches:
      - chore/research-curriculum-source
    paths-ignore:
      - research-output/**

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/research-curriculum-source
      - name: Fetch official sources without executing remote content
        shell: bash
        run: |
          set -u
          rm -rf research-output
          mkdir -p research-output
          cat > research-output/targets.tsv <<'EOF'
          program-343-ay23	https://bilgipaketi.uludag.edu.tr/Programlar/Detay/343?AyID=23
          program-343-ay21	https://bilgipaketi.uludag.edu.tr/Programlar/Detay/343?AyID=21
          iibf-plan-current	https://uludag.edu.tr/iibf/egitim-plani-14528
          iibf-plan-legacy	https://uludag.edu.tr/iibf/default/konu/1403
          EOF
          printf 'fetched_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > research-output/manifest.txt
          while IFS=$'\t' read -r name url; do
            code=$(curl --location --compressed --http1.1 --max-time 45 \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36' \
              --header 'Accept: text/html,application/xhtml+xml' \
              --dump-header "research-output/${name}.headers.txt" \
              --output "research-output/${name}.html" \
              --write-out '%{http_code}' "$url" || true)
            bytes=$(wc -c < "research-output/${name}.html")
            printf '%s\thttp=%s\tbytes=%s\turl=%s\n' "$name" "$code" "$bytes" "$url" >> research-output/manifest.txt
            grep -Eio 'href=["'"'][^"'"']+["'"']' "research-output/${name}.html" \
              | sed -E 's/^href=["'"']|["'"']$//g' \
              | sort -u > "research-output/${name}.hrefs.txt" || true
          done < research-output/targets.tsv
      - name: Commit immutable probe output to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research-output
          git commit -m 'chore: capture official curriculum source probe' || exit 0
          git push
