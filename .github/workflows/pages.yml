name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify Product Reset signature
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --retry 2 "$PAGE_URL" --output deployed.html \
              && grep --fixed-strings --quiet 'name="eko-release" content="product-reset-v1"' deployed.html; then
              echo "PASS: $PAGE_URL returned the Product Reset release signature."
              exit 0
            fi
            echo "Attempt $attempt/12: deployment is not ready; retrying in 10 seconds."
            sleep 10
          done
          echo "FAIL: deployed page did not return the Product Reset release signature."
          exit 1
